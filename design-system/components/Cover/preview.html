<style>
body{margin:0;background:var(--paper)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--paper)}

.amp{fill:var(--paper);font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144;font-weight:900;font-size:300px}
.star{fill:var(--yellow);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.name{position:absolute;left:40px;bottom:40px;max-width:440px;display:flex;flex-direction:column;gap:12px}
.name h1{margin:0;font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144;font-weight:900;font-size:120px;line-height:.92;color:var(--ink)}

<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">

blocks: yellow 192x224 (space-9*2), violet 240x224, ink 96x64 (space-9 x space-8), blue 144x48 (space-7) - all radius-0

pattern: "a distinctive display face -> one oversized glyph" - the Fraunces soft/wonky ampersand from the hero headline, cut out of violet, plus the one starburst sticker the brand uses per screen
scales: space-7 48, space-8 64, space-9 96; radius-0 on every block
-->
