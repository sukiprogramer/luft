<!-- @dsCard group="Content" height=380 subtitle="Project card in the newspaper style: rules, kicker, image, serif title." -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&amp;family=Poppins:wght@400;500;600&amp;family=Bitter:wght@400;700&amp;family=Gochi+Hand&amp;display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
.disp{font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144}
.kicker{font:600 13px/1.4 var(--font-sans);letter-spacing:3px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 24px;border-radius:var(--radius-pill);border:var(--border-bold) solid var(--line);font:600 15px var(--font-sans);text-decoration:none;cursor:pointer;box-sizing:border-box}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-accent{background:var(--yellow);color:var(--on-yellow);border-color:var(--on-yellow)}
.btn-outline{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
a{color:var(--blue)}
</style>
<div style="padding:24px;max-width:380px">
<a href="#" style="display:flex;flex-direction:column;gap:16px;background:var(--paper-deep);color:var(--ink);text-decoration:none;padding:24px">
<div style="border-top:var(--border-hairline) solid var(--line);border-bottom:var(--border-hairline) solid var(--line);padding:8px 0;text-align:center;font:600 12px var(--font-sans);letter-spacing:2px">SAMPLE · ILLUSTRATION · 2025</div>
<div role="img" aria-label="Project image placeholder" style="aspect-ratio:4/3;background:var(--photo);color:var(--on-photo);font-size:12px;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box">[ PROJECT IMAGE ]</div>
<h3 style="margin:0;font:500 30px/1.1 var(--font-display)">Paper Dogs</h3>
<p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink-soft)">A line-art identity for a neighbourhood dog café.</p>
</a>
</div>
