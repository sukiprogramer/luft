<!-- @dsCard group="Radio" height=340 subtitle="Playlist player for Radio Luft: controls, now playing, and tappable tracks." -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&amp;family=Poppins:wght@400;500;600&amp;family=Bitter:wght@400;700&amp;family=Gochi+Hand&amp;display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
.disp{font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144}
.kicker{font:600 13px/1.4 var(--font-sans);letter-spacing:3px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 24px;border-radius:var(--radius-pill);border:var(--border-bold) solid var(--line);font:600 15px var(--font-sans);text-decoration:none;cursor:pointer;box-sizing:border-box}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-accent{background:var(--yellow);color:var(--on-yellow);border-color:var(--on-yellow)}
.btn-outline{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
a{color:var(--blue)}
</style>
<div style="padding:24px;max-width:520px">
<div style="background:var(--violet);padding:28px;display:flex;flex-direction:column;gap:16px">
<h3 class="disp" style="margin:0;font-size:56px;line-height:.9;font-weight:900;color:var(--white)">Eos</h3>
<div style="background:var(--night);color:var(--on-night);padding:12px;display:flex;align-items:center;gap:12px">
<button type="button" aria-label="Pause" style="width:52px;height:52px;border-radius:999px;border:2px solid var(--on-yellow);background:var(--yellow);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18"><path d="M5 3 V15 M13 3 V15" stroke="var(--on-yellow)" stroke-width="3" stroke-linecap="round"></path></svg></button>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font:600 11px var(--font-sans);letter-spacing:2px;color:var(--yellow)">NOW PLAYING · 02 / 10</span><span style="font:400 16px var(--font-slab)"><b>Farsi</b> · Nu, Cafe de Anatolia</span></div>
</div>
<ol style="margin:0;padding:0;list-style:none;font:400 17px var(--font-slab);color:var(--on-violet)">
<li style="border-bottom:1px solid var(--on-violet)"><button type="button" style="width:100%;display:flex;gap:14px;padding:10px 8px;border:none;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer"><span style="width:24px;font:600 12px var(--font-sans)">01</span><span><b>Solo Quiero</b> · Montoya</span></button></li>
<li style="border-bottom:1px solid var(--on-violet)"><button type="button" aria-current="true" style="width:100%;display:flex;gap:14px;padding:10px 8px;border:none;background:var(--yellow);font:inherit;color:var(--on-yellow);text-align:left;cursor:pointer"><span style="width:24px;font:600 12px var(--font-sans)">♪</span><span><b>Farsi</b> · Nu, Cafe de Anatolia</span></button></li>
<li style="border-bottom:1px solid var(--on-violet)"><button type="button" style="width:100%;display:flex;gap:14px;padding:10px 8px;border:none;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer"><span style="width:24px;font:600 12px var(--font-sans)">03</span><span><b>Tan Bo Mi</b> · Jaggerlax</span></button></li>
</ol>
<span style="font:400 15px var(--font-slab);color:var(--on-violet)">Nemanja @ radio.luft</span>
</div>
</div>
